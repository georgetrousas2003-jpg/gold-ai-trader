services:
  # Frontend - Next.js
  - type: web
    name: gold-ai-trader-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://gold-ai-trader-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://gold-ai-trader-backend.onrender.com
    healthCheckPath: /
    autoDeploy: true

  # Backend - FastAPI
  - type: web
    name: gold-ai-trader-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: OANDA_ENVIRONMENT
        value: practice
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gold-trader-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: gold-trader-redis
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: gold-trader-db
    databaseName: gold_trader
    user: gold_trader
    plan: free
    region: oregon

  - name: gold-trader-redis
    plan: free
    region: oregon
